# Orca worktree recipe for Seatplus Core (https://www.onorca.dev)
#
# A fresh `git worktree` of this repo comes up BARE: /vendor, /node_modules,
# /public/build, .env and composer.local.json are all gitignored, so nothing below
# is checked out by git. This file (symlinked, shared deps) plus .worktreeinclude
# (copied, per-worktree-owned config) backfill them so an agent lands in a bootable
# checkout instead of an empty one.

worktree:
  # Large, gitignored, read-mostly directories. Orca symlinks these from the
  # primary checkout into each new worktree instead of copying — fast, no disk
  # blow-up. Safe because agents don't edit dependency dirs.
  #
  # ⚠️ `vendor` is shared and MUTABLE: a `composer update`/`install` run in any
  # worktree rewrites the PRIMARY checkout's vendor/ (and every other worktree's
  # view of it), while each worktree keeps its own composer.lock. Resolve deps in
  # the primary, not in a worktree.
  sharedDirectories:
    - node_modules            # root JS deps
    - vendor                  # root composer deps (merge-plugin already resolved)
    - public/build            # compiled Vite assets

# NOTE — package sources are deliberately NOT listed here.
#
# The seatplus/* packages are separate git repos cloned as SIBLINGS of core in the
# workspace (see "Working in Orca" in CLAUDE.md). `composer run local:on` writes
# composer.local.json path repos with ABSOLUTE urls anchored on the primary
# checkout, so every worktree already resolves the same package sources with
# nothing to symlink-share. (Historically these lived in core/packages/ and that
# tree was shared here; the nested layout is still supported as a fallback, but it
# is no longer the default.)
#
# ⚠️ TRADEOFF, unchanged and now unconditional: package SOURCE is shared across
# every worktree, so two agents editing the same package WILL clobber each other —
# there is no isolation. For isolated package work, open that package as its own
# Orca project (which is exactly why the sibling layout is the default), or give
# the agent its own worktree of the package repo and point core at it with
# ./orca-web-worktree.sh (web only).
