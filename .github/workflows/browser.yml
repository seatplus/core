name: Browser

on:
  push:
    branches: [ "5.x" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push screenshots to an orphan review branch
      pull-requests: write   # upsert the screenshot review comment

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: seatplus
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: seatplus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplus -d laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Packages come from Packagist (composer), not submodules — a plain checkout
      # + composer install assembles the whole app.
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis, sockets
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare app env
        run: |
          cp .env.example .env
          php artisan key:generate

      # The web package's frontend (package.json, vite/tailwind/postcss configs,
      # resources/js, css) is published into core, not committed.
      - name: Publish web package assets
        run: |
          php artisan vendor:publish --tag=web-static --force
          php artisan vendor:publish --tag=web --force

      # Browser tests are authored in the web package and shipped in its dist;
      # run them here against the assembled app (no-op until web ships tests/Browser).
      - name: Pull in web-owned browser tests
        run: |
          if [ -d vendor/seatplus/web/tests/Browser ]; then
            mkdir -p tests/Browser/web
            cp -R vendor/seatplus/web/tests/Browser/. tests/Browser/web/
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies + Playwright driver
        run: |
          npm install
          npm install --save-dev playwright

      - name: Build assets
        run: npm run build

      - name: Install Playwright browser (chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: vendor/bin/pest tests/Browser --no-coverage

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: warn
          retention-days: 7

      # Publish the screenshots so they can be reviewed inline on the PR instead of
      # downloading the zip. GitHub markdown can only embed hosted images, so push this run's
      # PNGs to a tiny orphan branch (single force-pushed commit — no history growth; core is
      # public so raw.githubusercontent URLs render) and build a sticky comment from them.
      - name: Stage screenshots for the PR comment
        id: screenshots
        if: always() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC=tests/Browser/Screenshots
          mapfile -t shots < <(find "$SRC" -type f -name '*.png' 2>/dev/null | sort)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "has_screenshots=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="screenshots-pr-${PR}"
          work="$(mktemp -d)"
          for f in "${shots[@]}"; do cp "$f" "$work/$(basename "$f")"; done

          git -C "$work" init -q
          git -C "$work" checkout -q --orphan shots
          git -C "$work" add .
          git -C "$work" -c user.name='seatplus-ci' -c user.email='ci@seatplus.local' \
            commit -q -m "browser screenshots for PR #${PR} (${GITHUB_SHA})"
          git -C "$work" push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "shots:${branch}"

          # Pair screenshots by view name: files are named "<view>-desktop.png" / "<view>-iphone.png"
          # (see snap() in the browser tests), so group them into one row per view with a Desktop and
          # an iPhone column. Anything without a device suffix is listed underneath.
          # Assign `=()` rather than just declaring: a declared-but-never-assigned array
          # still counts as unset, so under `set -u` the ${#other_url[@]} guard below
          # aborts the step whenever every screenshot carries a device suffix — i.e. always.
          declare -A desktop_url=() iphone_url=() other_url=()
          for f in "${shots[@]}"; do
            base="$(basename "$f")"
            name="$(basename "$f" .png)"
            url="https://raw.githubusercontent.com/${REPO}/${branch}/${base}"
            case "$name" in
              *-desktop) desktop_url["${name%-desktop}"]="$url" ;;
              *-iphone)  iphone_url["${name%-iphone}"]="$url" ;;
              *)         other_url["$name"]="$url" ;;
            esac
          done

          comment="$RUNNER_TEMP/screenshots-comment.md"
          {
            echo "<!-- browser-screenshots -->"
            echo "## 📸 Browser test screenshots"
            echo
            echo "Run [#${GITHUB_RUN_ID}](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}) · commit \`$(echo "${GITHUB_SHA}" | cut -c1-7)\` · status **${{ job.status }}**"
            echo
            echo "| View | Desktop | iPhone |"
            echo "| --- | --- | --- |"
            while IFS= read -r key; do
              [ -z "$key" ] && continue
              d="${desktop_url[$key]:-}"
              i="${iphone_url[$key]:-}"
              dcell="—"; icell="—"
              [ -n "$d" ] && dcell="<img src=\"$d\" width=\"420\">"
              [ -n "$i" ] && icell="<img src=\"$i\" width=\"220\">"
              echo "| \`${key}\` | ${dcell} | ${icell} |"
            done < <(printf '%s\n' "${!desktop_url[@]}" "${!iphone_url[@]}" | sort -u)

            if [ ${#other_url[@]} -gt 0 ]; then
              echo
              echo "<details><summary>Other screenshots</summary>"
              echo
              while IFS= read -r name; do
                [ -z "$name" ] && continue
                echo "<img src=\"${other_url[$name]}\" width=\"420\"> "
              done < <(printf '%s\n' "${!other_url[@]}" | sort)
              echo
              echo "</details>"
            fi
          } > "$comment"

          echo "has_screenshots=true" >> "$GITHUB_OUTPUT"
          echo "comment_path=$comment" >> "$GITHUB_OUTPUT"

      - name: Find existing screenshot comment
        id: find_comment
        if: always() && steps.screenshots.outputs.has_screenshots == 'true'
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- browser-screenshots -->'

      - name: Upsert screenshot comment
        if: always() && steps.screenshots.outputs.has_screenshots == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.screenshots.outputs.comment_path }}
          edit-mode: replace
